channels:
  - conda-forge
  - bioconda
dependencies:
  # Same R as the R-IDE template image, so RStudio keeps working after
  # Wave copies this environment over the template's /opt/conda.
  - r-base=4.5.3
  # Also match the template's compiler sysroot. Wave's build host has glibc
  # 2.34, so the solver otherwise picks sysroot 2.34, whose sysroot/sbin is a
  # directory where the template has a symlink, and the COPY step fails.
  - sysroot_linux-64=2.39
  - bioconductor-deseq2
  - bioconductor-apeglm
  - bioconductor-summarizedexperiment
  - r-tidyverse
  - r-pheatmap
  - r-ggrepel
  - r-rmarkdown

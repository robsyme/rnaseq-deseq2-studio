schemaVersion: "0.0.1"
kind: "studio-config"
session:
    name: "rnaseq-deseq2"
    description: "RStudio with DESeq2 for differential expression on nf-core/rnaseq results"
    template:
        kind: "registry"
        registry: "public.cr.seqera.io/platform/data-studio-ride:2026.01.2-0.15"
    clone:
        enabled: true
        path: "/workspace"
    dependencies:
        condaEnvironmentFile: "environment.yaml"
    management:
        lifespanHours: 8
        isPrivate: false
    ssh:
        enabled: true
